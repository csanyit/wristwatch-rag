name: Deploy wristwatch RAG code
run-name: run ${{ inputs.lambda_name }} deployment on ${{ inputs.environment }}/${{ inputs.region }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
      region:
        description: Deployment region
        required: true
        type: choice
        options:
          - eu-west-1
      lambda_name:
        description: Name of the Lambda function to deploy
        required: true
        type: choice
        options:
          - rag_query_lambda
          - vector_db_builder_lambda
      dependency_profile:
        description: Dependency profile for the selected Lambda
        required: true
        type: choice
        default: lambda-builder-bedrock
        options:
          - lambda-builder-bedrock
          - lambda-builder-self-hosted

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy ${{ inputs.lambda_name }} (${{ inputs.environment }}/${{ inputs.region }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs and select Lambda source directory
        id: selection
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_LAMBDA_NAME: ${{ inputs.lambda_name }}
        run: |
          python3 .github/scripts/deploy-code-selection-validation.py \
            --environment "$INPUT_ENVIRONMENT" \
            --region "$INPUT_REGION" \
            --lambda_name "$INPUT_LAMBDA_NAME"

      - name: Install Lambda dependencies
        env:
          DEPENDENCY_PROFILE: ${{ inputs.dependency_profile }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --target package \
            ".[${DEPENDENCY_PROFILE}]"

      - name: Create Lambda zip package
        env:
          LAMBDA_NAME: ${{ inputs.lambda_name }}
          SOURCE_DIRECTORY: ${{ steps.selection.outputs.source_directory }}
        run: |
          set -euo pipefail
          package_name="${LAMBDA_NAME%_lambda}"
          package_path="$RUNNER_TEMP/$LAMBDA_NAME.zip"
          test -d "$SOURCE_DIRECTORY"

          cp src/watch_rag.properties package/

          (
            cd package
            zip -r "$package_path" .
          )
          test -s "$package_path"

          unzip -l "$package_path" | grep -q 'pandas/'

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload Lambda package to S3
        env:
          LAMBDA_NAME: ${{ inputs.lambda_name }}
          LAMBDA_CODE_BUCKET: ${{ secrets.LAMBDA_CODE_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "$LAMBDA_CODE_BUCKET" ]]; then
            echo "::error::The LAMBDA_CODE_BUCKET secret must be configured"
            exit 1
          fi
          aws s3 cp \
            "$RUNNER_TEMP/$LAMBDA_NAME.zip" \
            "s3://$LAMBDA_CODE_BUCKET/$LAMBDA_NAME/$LAMBDA_NAME.zip"
