name: Deploy wristwatch RAG infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terragrunt action to run
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy-plan
          - destroy-apply
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
      module:
        description: Terragrunt module
        required: true
        type: choice
        options:
          - lambda_code_bucket
          - rag_query_lambda
          - vector_db_builder_lambda
          - watch_specification_files_bucket

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terragrunt ${{ inputs.action }} (${{ inputs.environment }}/${{ inputs.module }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs and select module directory
        id: selection
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODULE: ${{ inputs.module }}
        run: |
          python3 .github/scripts/deploy-selection-validation.py \
            --action "$INPUT_ACTION" \
            --environment "$INPUT_ENVIRONMENT" \
            --module "$INPUT_MODULE"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
          terraform_wrapper: false

      - name: Install Terragrunt
        env:
          TERRAGRUNT_VERSION: 1.2.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            --output "$RUNNER_TEMP/terragrunt"

          if ! printf '%s  %s\n' \
            "f2f6238ad2348855a4e876b90fd31f3f5d106bb234794202a00b2bcc139fa753" \
            "$RUNNER_TEMP/terragrunt" | sha256sum --check --status; then
            echo "::error::Terragrunt checksum verification failed"
            exit 1
          fi

          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Terragrunt init
        working-directory: ${{ steps.selection.outputs.directory }}
        run: terragrunt init --backend-bootstrap

      - name: Run selected Terragrunt action
        working-directory: ${{ steps.selection.outputs.directory }}
        env:
          TG_COMMAND: ${{ steps.selection.outputs.terragrunt_command }}
          TG_NON_INTERACTIVE: "true"
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "1"
        run: |
          set -euo pipefail
          read -r -a tg_args <<< "$TG_COMMAND"

          if [[ "${tg_args[0]}" == "apply" ]]; then
            tg_args=("${tg_args[0]}" -auto-approve "${tg_args[@]:1}")
          fi

          terragrunt "${tg_args[@]}"