[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-rag"
version = "0.1.0"
description = "A Python project using Qdrant for vector search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas<=3.1.0",
]

[project.optional-dependencies]
lambda-builder-bedrock = [
    "boto3>=1.43.0",
]
lambda-builder-self-hosted = [
    "ollama>=0.4.0",
    "qdrant-client>=1.9.0",
    "sentence_transformers>=6.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["watch_rag_providers"]

[tool.setuptools.package-data]
watch_rag = ["*.properties"]
